# Builds, tests and format-checks the firmware. Never rewrites the branch:
# format locally (the Claude Code hook does it on edit) and CI only verifies.
name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

jobs:
    format:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install clang-format 19 (same major version as local LLVM 19)
              run: pip install "clang-format==19.1.*"
            - name: Check formatting
              run: |
                  clang-format --version
                  find ESP32/src ESP32/include ESP32/lib ESP32/test ESP32/bench -type f \
                      \( -name '*.c' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) \
                      ! -name index_html.h -print0 \
                      | xargs -0 clang-format --dry-run --Werror --style=file

    web-ui-generator:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Test index_html.h generator
              run: python -m unittest discover -s web -p "test_*.py" -v

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            # custom_sdkconfig rebuilds the Arduino libs into ~/.platformio (slow); pioarduino reuses them only while
            # ESP32/sdkconfig.defaults (its hash of the custom options) is present, so cache that file too.
            - uses: actions/cache@v4
              with:
                  path: |
                      ~/.platformio
                      ESP32/sdkconfig.defaults
                  key: pio-core3-${{ runner.os }}-${{ hashFiles('ESP32/platformio.ini') }}
            - name: Install PlatformIO
              run: pip install -U platformio
            - name: Build turret firmware (Arduino core 3.3.12)
              working-directory: ESP32
              run: pio run -e freenove_esp32_wrover
            - name: Build pin_check
              working-directory: ESP32
              run: pio run -e pin_check

    native-tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - uses: actions/cache@v4
              with:
                  path: ~/.platformio
                  key: pio-native-${{ runner.os }}-${{ hashFiles('ESP32/platformio.ini') }}
            - name: Install PlatformIO
              run: pip install -U platformio
            - name: Run host unit tests
              working-directory: ESP32
              run: pio test -e native

    native-sanitize:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - uses: actions/cache@v4
              with:
                  path: ~/.platformio
                  key: pio-native-sanitize-${{ runner.os }}-${{ hashFiles('ESP32/platformio.ini') }}
            - name: Install PlatformIO
              run: pip install -U platformio
            - name: Run host unit tests under ASan + UBSan
              working-directory: ESP32
              run: pio test -e native_sanitize

    # Line/branch coverage of the native suite. Each suite runs on its own and its counters are captured and zeroed
    # before the next, because pio rebuilds the shared library objects per suite (which resets their .gcda files).
    coverage:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - uses: actions/cache@v4
              with:
                  path: ~/.platformio
                  key: pio-native-coverage-${{ runner.os }}-${{ hashFiles('ESP32/platformio.ini') }}
            - name: Install PlatformIO and lcov
              run: |
                  pip install -U platformio
                  sudo apt-get update -qq && sudo apt-get install -y -qq lcov
            - name: Gate script tests
              run: python -m unittest discover -s tools/coverage -p "test_*.py" -v
            - name: Run each native suite with coverage
              working-directory: ESP32
              run: |
                  mkdir -p ../coverage/parts
                  LCOV="--ignore-errors mismatch,unused,negative,inconsistent,empty --rc branch_coverage=1"
                  for suite in test/native/test_*; do
                      name=$(basename "$suite")
                      lcov $LCOV --zerocounters --directory .pio/build/native_coverage 2>/dev/null || true
                      pio test -e native_coverage -f "native/$name"
                      lcov $LCOV --capture --directory .pio/build/native_coverage --output-file "../coverage/parts/$name.info"
                  done
                  lcov $LCOV $(for f in ../coverage/parts/*.info; do echo "--add-tracefile $f"; done) \
                      --output-file ../coverage/all.info
                  lcov $LCOV --remove ../coverage/all.info '/usr/*' '*/test/*' '*/.pio/*' \
                      --output-file ../coverage/coverage.info
            - name: Per-library summary and floor
              run: python tools/coverage/coverage_gate.py coverage/coverage.info --floor 0
            - name: HTML report
              if: always()
              run: genhtml --ignore-errors inconsistent,corrupt,unmapped,source --branch-coverage coverage/coverage.info --output-directory coverage/html || true
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: native-coverage
                  path: |
                      coverage/coverage.info
                      coverage/html

    tracking-bench:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Tool tests
              run: |
                  pip install pillow
                  python -m unittest discover -s tools/tracking -p "test_*.py"
            - name: Fixtures are up to date
              run: |
                  python tools/tracking/make_synthetic_clips.py /tmp/fixtures
                  for f in /tmp/fixtures/*.gray; do
                      cmp "$f" "ESP32/bench/fixtures/$(basename "$f")"
                  done
            - name: Build bench (release and ASan+UBSan)
              run: |
                  SRC="ESP32/lib/tracking/src/*.cpp ESP32/bench/track_bench.cpp"
                  INC="-I ESP32/include -I ESP32/lib/tracking/include"
                  g++ -std=c++20 -O2 -g -fno-omit-frame-pointer -Wall -Wextra $INC $SRC -o track_bench
                  g++ -std=c++20 -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined                       -fno-sanitize-recover=all $INC $SRC -o track_bench_asan
            - name: Clip regression under ASan+UBSan
              run: ./track_bench_asan ESP32/bench/fixtures/*.gray
            - name: Clip regression and timing (release)
              run: ./track_bench --repeat 20 ESP32/bench/fixtures/*.gray
            - name: Instruction counts per frame (cachegrind, deterministic)
              run: |
                  sudo apt-get update -qq && sudo apt-get install -y -qq valgrind
                  for clip in ESP32/bench/fixtures/*.gray; do
                      frames=$(( $(stat -c %s "$clip") / 1200 ))
                      valgrind --tool=cachegrind --cache-sim=no --cachegrind-out-file=/dev/null                           ./track_bench --repeat 10 "$clip" 2> cg.txt > /dev/null
                      ir=$(grep -oP 'I\s+refs:\s+\K[0-9,]+' cg.txt | tr -d ,)
                      echo "$(basename "$clip"): $(( ir / (frames * 10) )) instructions/frame (incl. clip load)"
                  done
            - name: perf stat (best effort; hardware counters may be unavailable on hosted runners)
              continue-on-error: true
              run: |
                  sudo apt-get install -y -qq linux-tools-common linux-tools-$(uname -r) || exit 1
                  sudo sysctl -w kernel.perf_event_paranoid=-1
                  perf stat -e instructions,task-clock ./track_bench --repeat 50 ESP32/bench/fixtures/*.gray
