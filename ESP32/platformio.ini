; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:freenove_esp32_wrover]
platform = espressif32@6.12.0
board = freenove_esp32_wrover
framework = arduino
; C++17: the Arduino core hard-codes gnu++11; its GCC 8.4 supports C++17 fully.
; C++20/23 needs Arduino core 3.x (pioarduino platform) - planned as its own toolchain stage.
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-I include
	-DBOARD_HAS_PSRAM
	-D CORE_DEBUG_LEVEL=4
monitor_filters = 
	esp32_exception_decoder
	colorize
lib_deps = 
	madhephaestus/ESP32Servo@^3.0.9
	arduino-libraries/Stepper@^1.1.3
	espressif/esp32-camera@^2.0.4
check_tool = cppcheck
check_skip_packages = yes
check_src_filters = 
	src
	include
	lib
check_flags = 
	cppcheck: --enable=warning,performance,portability
	--inline-suppr
	--std=c++17
	--suppress=unusedFunction
	--suppress=missingInclude
	--suppress=missingIncludeSystem
	--suppress=*:*/.pio/*
extra_scripts = pre:../web/update_index_html.py
build_src_filter = +<*> -<pin_check/>
test_ignore = native/*

; Wiring bring-up check: `pio run -e pin_check -t upload`, then read serial at 115200
[env:pin_check]
extends = env:freenove_esp32_wrover
build_src_filter = +<pin_check/>
extra_scripts =

; Host-side unit tests for hardware-free logic: `pio test -e native` (needs g++ >= 8 first on PATH)
[env:native]
platform = native
test_framework = unity
test_filter = native/*
build_flags =
	-I include
	-std=gnu++17
