; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Arduino core 3.3.12 (pioarduino 55.03.312, ESP-IDF 5.5.5, GCC 14), C++20.
; The esp32-camera driver is bundled with core 3, so it is not a lib_dep.
[env:freenove_esp32_wrover]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = freenove_esp32_wrover
framework = arduino
; Core 3 passes -std=gnu++2b and -std=gnu++2a itself (last one wins); drop them (and core 2's gnu++11) so only
; -std=gnu++20 below reaches C++ files.
build_unflags = -std=gnu++11 -std=gnu++2b -std=gnu++2a
build_flags =
	-std=gnu++20
	-I include
	-DBOARD_HAS_PSRAM
	-D CORE_DEBUG_LEVEL=4
monitor_speed = 115200 ; must match BAUDRATE in include/constants.h (pio defaults to 9600 -> garbled output)
monitor_filters = 
	esp32_exception_decoder
	colorize
lib_deps =
	madhephaestus/ESP32Servo@^3.0.9
check_tool = cppcheck
check_skip_packages = yes
check_src_filters = 
	src
	include
	lib
check_flags = 
	cppcheck: --enable=warning,performance,portability
	--inline-suppr
	--std=c++20
	--suppress=unusedFunction
	--suppress=missingInclude
	--suppress=missingIncludeSystem
	--suppress=*:*/.pio/*
extra_scripts = pre:../web/update_index_html.py
build_src_filter = +<*> -<pin_check/>
test_ignore = native/*
; Core 3 binary is ~1.14 MB (86.8% of the default 1.25 MB app slot); min_spiffs gives 1.875 MB per slot and keeps
; OTA. NVS stays at 0x9000 / 0x5000 in both tables, so saved WiFi networks and the calibration survive.
board_build.partitions = partitions_min_spiffs.csv
; IDF 5.5 runs WebSocket handshakes through ws_pre/post_handshake_cb instead of calling the URI handler with
; HTTP_GET; both are off in the precompiled Arduino libs. custom_sdkconfig makes pioarduino rebuild the libs with them
; (first build is slow, then cached until this list changes). The origin check and /stream viewer registration need them.
; The rebuild derives flash and PSRAM clocks from f_flash (board json: 40 MHz, which drops PSRAM to 40 MHz). 80 MHz
; keeps the precompiled libs' PSRAM 80 MHz (on the ESP32 that needs flash at 80 MHz too, as the libs had). The clocks
; are also spelled out below because f_flash is not part of pioarduino's "libs up to date" checksum; only this list is.
; pin_check inherits this block unchanged: the rebuilt libs are keyed on this exact text, so an env with a different
; custom_sdkconfig would trigger a full rebuild every time you switch envs.
board_build.f_flash = 80000000L
custom_sdkconfig =
	CONFIG_HTTPD_WS_PRE_HANDSHAKE_CB_SUPPORT=y
	CONFIG_HTTPD_WS_POST_HANDSHAKE_CB_SUPPORT=y
	CONFIG_ESPTOOLPY_FLASHFREQ_80M=y
	'# CONFIG_ESPTOOLPY_FLASHFREQ_40M is not set'
	CONFIG_ESPTOOLPY_FLASHFREQ="80m"
	CONFIG_SPIRAM_SPEED_80M=y
	'# CONFIG_SPIRAM_SPEED_40M is not set'
	CONFIG_SPIRAM_SPEED=80

; Wiring bring-up check: `pio run -e pin_check -t upload`, then read serial at 115200
[env:pin_check]
extends = env:freenove_esp32_wrover
build_src_filter = +<pin_check/>
extra_scripts =

; Host-side unit tests for hardware-free logic: `pio test -e native` (needs g++ >= 10 first on PATH)
[env:native]
platform = native
test_framework = unity
test_filter = native/*
build_flags =
	-I include
	-std=gnu++20

; Native tests under AddressSanitizer + UndefinedBehaviorSanitizer. Linux only (runs in CI);
; the Windows MinGW toolchains ship no libasan/libubsan.
[env:native_sanitize]
extends = env:native
build_flags =
	${env:native.build_flags}
	-fsanitize=address,undefined
	-fno-sanitize-recover=all
	-fno-omit-frame-pointer
	-g
extra_scripts = post:scripts/sanitize_link.py
